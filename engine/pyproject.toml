[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-tts-engine"
version = "0.1.0"
description = "Model and Persian text processing for Open TTS"
requires-python = ">=3.12"
dependencies = [
    "pocket-tts>=3.3,<4",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_tts_engine = ['assets/*.wav', 'assets/*.md']
