[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-tts-webui"
version = "0.1.0"
description = "Local browser interface for Open TTS"
requires-python = ">=3.12"
dependencies = [
    "gradio",
    "httpx",
    "open-tts-common",
]

[project.scripts]
open-tts-webui = "open_tts_webui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
open-tts-common = { path = "../common", editable = true }
